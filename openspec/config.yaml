# SDD config for pixel-agents
schema: spec-driven

context: |
  Greenfield project, no stack chosen yet (zero package.json/go.mod/pyproject.toml/Cargo.toml).
  Target: passive log-reader "office" agent visualizer (Category B — no hooks, no settings.json writes).
  Multi-harness: Claude Code, Codex, Antigravity, OpenCode session logs on disk.
  Must launch agents/subagents from the visualization; compatible with gentle-ai and Engram.
  Git repository on branch main, remote origin https://github.com/amalvarezme/pixel-agents.

strict_tdd: true
strict_tdd_marker: true
strict_tdd_note: >
  Re-resolved 2026-09-06 on branch slice-1a-contracts-toolchain: strict_tdd flips to true
  because a workspace-level test command now exists (testing.test_command below) and covers
  the sole in-scope project (office-agent-visualizer), verified by actually running
  `npm test` (4 files, 10 tests passed) and `npm run typecheck` (zero errors). This
  supersedes the prior fail-closed resolution recorded when zero projects were discovered.
  BRANCH CAVEAT: this true resolution is valid for work on the slice-1a-contracts-toolchain
  branch chain (this branch and its descendants, e.g. slice 1a-ii onward). On `main`,
  openspec/config.yaml still declares projects: [] and test_command: null — strict_tdd
  there becomes true only once PR #1 (https://github.com/amalvarezme/pixel-agents/pull/1)
  merges this toolchain into main.

testing:
  projects: ["office-agent-visualizer"]
  test_command: "npm test"
  notes: >
    Node/TypeScript + Vitest, selected in slice 1a (office-agent-visualizer). Run
    `npm run typecheck` for `tsc --noEmit` and `npm run test:watch` for the Vitest
    watch runner.

rules:
  proposal:
    - Confirm stack choice (language/runtime, UI/rendering layer) before scoping work
    - Preserve passive log-reader architecture: no hooks, no ~/.claude/settings.json writes
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Multi-harness log formats (Claude Code, Codex, Antigravity, OpenCode) must be modeled explicitly
  design:
    - Document how each harness's session logs are located and parsed without hooks
    - Document the agent-launch mechanism from the visualizer (process spawn, not hook injection)
    - Document how Engram save events are detected and animated in the office view
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns once a stack is chosen
    tdd: true            # re-resolved true 2026-09-06; see strict_tdd_note (branch-scoped, see caveat)
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "npm run typecheck"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
